packages:
  - "packages/*"
allowBuilds:
  esbuild: true
# pnpm 10+ は package.json の "pnpm" フィールドを読まないため overrides はここに置く。
# @azure/msal 経由で入る古い uuid(8.x, deprecated) を 14 系へ引き上げる。
overrides:
  uuid@<14: "^14.0.0"
  # transitive な shell-quote の DoS/エスケープ欠陥（GHSA）を patch 版へ引き上げる。
  shell-quote@<1.9.0: "^1.9.0"
  # Dependabot の transitive な脆弱性（DoS 等）を patch 版へ引き上げる。mysql2 は better-auth / drizzle-orm の任意の peer。
  browserslist@<4.28.7: "^4.28.7"
  baseline-browser-mapping@<2.11.0: "^2.11.0"
  mysql2@<3.23.1: "^3.23.1"
  # better-auth / tanstack 経由の zod 4 系をメモリ枯渇の修正版へ。
  zod@>=4 <4.6.6: "^4.6.6"
  # drizzle-orm の任意の peer の mssql は使わない（pg だけ）。msal-node の脆弱性ごと外す。
  mssql: "-"
  "@types/mssql": "-"
