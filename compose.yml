services:
  # Postgres 18（prd/15）。server はこれに繋ぐ。
  # 🔒 ロールを 2 つに分ける（prd/15 §2）: 管理ロール = POSTGRES_USER（DDL・マイグレーション）、
  # server ロール = DB_USER（DML のみ。scripts/postgres-init/10-server-role.sh が空の volume の初回に作る）
  db:
    image: postgres:18-alpine
    environment:
      TZ: 'Asia/Tokyo'
    env_file:
      - .env.database
    volumes:
      # ⚠ Postgres 18 の公式イメージはデータを /var/lib/postgresql/18/docker に置く（親を mount する）
      - pg-data:/var/lib/postgresql
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    # host には公開しない（compose 網内からのみ到達）。ホスト実行の db ツール
    # （pnpm db:migrate:dev / db:seed / *:dev）は scripts/db-forward.sh が都度 port-forward する。
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 20s
      retries: 3
      start_period: 5s

  # 旧 MySQL（prd/15 §8.1）。**server からは使わない。** データ移行（prd/15 §6）の練習で
  # 移行元として読むためだけに残す（volume は旧 db の db-data のまま）。後片付けの PR で消す。
  db-mysql:
    image: mysql:8.4
    environment:
      TZ: 'Asia/Tokyo'
    env_file:
      - .env.database
    volumes:
      - db-data:/var/lib/mysql
    cap_add:
      - SYS_NICE
    healthcheck:
      test: mysql -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e "select 1;"
      interval: 5s
      timeout: 20s
      retries: 3
      start_period: 5s

  server:
    # 🔒 dev のイメージには -dev を付ける。本番 worker はローカルビルドの `seseraki-worker:latest` を
    # 参照しているため、compose の既定名（<project>-<service>）のままだと dev のビルドが本番のタグを上書きする
    image: seseraki-server-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env.database
      - .env.server
    environment:
      TZ: 'Asia/Tokyo'
      # 🔒 dev の抜け道（dev ログイン・email+password・秘密の固定値）は development のときだけ開く
      # （prd/07 §6。許可リスト方式なので、ここを外すと dev ログインが 404 になる）
      NODE_ENV: development
      # ブラウザから見えるオリジン（Vite。/api は Vite の proxy が server へ渡す。prd/07 §6.2）。
      # remote は .env.remote で公開オリジン（https）を渡す——https なら cookie に Secure が付く
      BETTER_AUTH_URL: '${BETTER_AUTH_URL:-http://localhost:5173}'
      # 🔒 web と同じ値を渡す。localhost 以外（＝公開ホストがある）なら dev の抜け道を閉じる（prd/07 §6）。
      # BETTER_AUTH_URL を localhost のまま公開経路だけ作った食い違いでも開かないように
      DEV_ALLOWED_HOST: '${DEV_ALLOWED_HOST:-localhost}'
    command: pnpm --filter server start
    depends_on:
      db:
        condition: service_healthy
    # host には公開しない。ブラウザは web(Vite) の /api proxy 経由で server に届き
    # （DEV_API_TARGET=http://server:4000）、compose 内 worker も compose 網内で
    # server:4000 に繋ぐ。Docker 外 worker を使う場合は SERVER_URL を web の /api proxy
    # （http://localhost:5173）へ向ける（prd/02 §6）。
    expose:
      - '4000'
    develop:
      watch:
        - action: sync+restart
          path: ./packages/shared
          target: /workspace/packages/shared
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./packages/server
          target: /workspace/packages/server
          ignore:
            - node_modules/
            - dist/
            - '*.tsbuildinfo'
            - '*.log'
        - action: rebuild
          path: pnpm-lock.yaml

  worker:
    image: seseraki-worker-dev
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    working_dir: /workspace
    env_file:
      - .env.worker
    environment:
      TZ: 'Asia/Tokyo'
      # 接続先は compose 内 server に固定（web の DEV_API_TARGET と同じ流儀）。
      # .env.worker が本番向きでも dev/remote compose の worker は本番を叩かない保険。
      SERVER_URL: 'http://server:4000'
    cpus: 1
    command: pnpm --filter worker start
    depends_on:
      server:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./packages/shared
          target: /workspace/packages/shared
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./packages/worker
          target: /workspace/packages/worker
          ignore:
            - node_modules/
            - dist/
            - '*.tsbuildinfo'
            - '*.log'
            - Dockerfile
            - Dockerfile.engine
        - action: rebuild
          path: pnpm-lock.yaml

  web:
    image: seseraki-web-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env.web
    environment:
      TZ: 'Asia/Tokyo'
      # 同一オリジン配信: ブラウザは /api を叩き、Vite が compose 内の server へ素通しで転送。
      # server は basePath('/api') なのでパスは書き換えない。.env.web の VITE_API_URL は不要。
      DEV_API_TARGET: 'http://server:4000'
      # リモート公開時のみ設定（vite.config.ts が allowedHosts / HMR wss:443 を条件付与）。
      # ローカルは localhost（＝リモート差分なし）。
      DEV_ALLOWED_HOST: '${DEV_ALLOWED_HOST:-localhost}'
    command: pnpm --filter web dev --host
    # ローカルは 127.0.0.1:5173 だけで待ち受ける（LAN から dev ログインで所有者になれないように）。
    # 実機確認などで LAN に開くときだけ WEB_BIND=5173 を明示する。リモートは .env.remote の WEB_BIND=127.0.0.1:<port> で
    # cloudflared 向けに 127.0.0.1 の1ポートだけ公開する。
    ports:
      - '${WEB_BIND:-127.0.0.1:5173}:5173'
    depends_on:
      - server
    develop:
      watch:
        - action: sync
          path: ./packages/shared
          target: /workspace/packages/shared
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/web
          target: /workspace/packages/web
          ignore:
            - node_modules/
            - dist/
            - '*.tsbuildinfo'
            - '*.log'
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  pg-data:
  # 旧 MySQL のデータ（db-mysql。データ移行の練習が済んだら消す）
  db-data:
