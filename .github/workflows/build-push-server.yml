name: Build and push server image

on:
  workflow_dispatch:
  # TODO: staging 環境導入時に push トリガーを有効化
  # push:
  #   branches: [main]
  #   paths:
  #     - packages/server/**
  #     - package.json
  #     - pnpm-lock.yaml

env:
  IMAGE_NAME: ghcr.io/daiius/seseraki-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ビルドの版（GET /api/version が返す。prd/02 §5「版の確かめ方」）。日時は UTC。
      - name: Build time
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # checkout したままのツリーからビルドするので dirty は常に false。
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
            GIT_DIRTY=false
